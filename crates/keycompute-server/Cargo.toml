[package]
name = "keycompute-server"
version = "0.1.0"
edition = "2024"

[dependencies]
keycompute-types = { workspace = true }
keycompute-db = { workspace = true }
keycompute-auth = { workspace = true }
keycompute-ratelimit = { workspace = true }
keycompute-pricing = { workspace = true }
keycompute-routing = { workspace = true }
keycompute-runtime = { workspace = true }
keycompute-billing = { workspace = true }
keycompute-distribution = { workspace = true }
keycompute-observability = { workspace = true }
keycompute-config = { workspace = true }
keycompute-emailserver = { path = "../keycompute-emailserver" }
keycompute-alipay = { path = "../keycompute-payment/keycompute-alipay" }
keycompute-wechatpay = { workspace = true }
keycompute-cache = { workspace = true }
node-gateway = { path = "../node-gateway" }
llm-gateway = { workspace = true }
llm-protocol-provider = { workspace = true }
llm-protocol-openai = { workspace = true }
llm-protocol-anthropic = { workspace = true }

axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
bytes = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sea-orm = { workspace = true }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.35"
bigdecimal = { version = "0.4", features = ["serde"] }
tracing = "0.1"
futures = "0.3"
tokio-stream = "0.1"
async-trait = "0.1"
async-stream = "0.3"
anyhow = "1.0"
thiserror = "2"
percent-encoding = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
url = "2"
deadpool-redis = { version = "0.18", optional = true }

[features]
default = ["redis"]
redis = ["keycompute-ratelimit/redis", "keycompute-runtime/redis", "dep:deadpool-redis"]

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.12", features = ["json"] }
