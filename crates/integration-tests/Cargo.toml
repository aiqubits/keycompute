[package]
name = "integration-tests"
version = "0.1.0"
edition = "2024"

[dependencies]
# 被测试的 crates
keycompute-types = { workspace = true }
keycompute-db = { workspace = true }
keycompute-auth = { workspace = true }
keycompute-ratelimit = { workspace = true, features = ["redis"] }
keycompute-pricing = { workspace = true }
keycompute-routing = { workspace = true }
keycompute-runtime = { workspace = true, features = ["redis"] }
keycompute-billing = { workspace = true }
keycompute-distribution = { workspace = true }
keycompute-observability = { workspace = true }
keycompute-server = { workspace = true }
keycompute-cache = { workspace = true }
keycompute-emailserver = { workspace = true }
llm-protocol-provider = { workspace = true }
llm-protocol-openai = { workspace = true }
llm-protocol-anthropic = { workspace = true }
llm-gateway = { workspace = true }
node-gateway = { workspace = true }

# 测试依赖
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1.35"
bigdecimal = "0.4"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { workspace = true }
sha2 = "0.10"
hex = "0.4"
dotenv = "0.15"

# 测试框架
anyhow = "1.0"
once_cell = "1.19"
dashmap = "6.0"
serial_test = "3.1"
async-trait = "0.1"
bytes = "1"
tiktoken-rs = "0.11.0"
deadpool-redis = "0.18"

[dev-dependencies]
tokio-test = "0.4"

# 测试文件在 tests/ 目录下自动发现
