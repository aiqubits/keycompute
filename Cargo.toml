[workspace]
resolver = "2"
members = [
    "packages/ui",
    "packages/web",
    "packages/desktop",
    "packages/mobile",
    "packages/client-api", "crates/keycompute-payment/keycompute-alipay", "crates/keycompute-payment/keycompute-wechatpay", "crates/keycompute-runtime", "crates/llm-gateway", "crates/keycompute-types", "crates/keycompute-db", "crates/keycompute-auth", "crates/keycompute-ratelimit", "crates/keycompute-pricing", "crates/keycompute-routing", "crates/keycompute-billing", "crates/keycompute-distribution", "crates/keycompute-observability",
    "crates/keycompute-server",
    "crates/integration-tests", "crates/keycompute-config", "crates/keycompute-emailserver", "crates/node-gateway",
    "crates/keycompute-cache", "crates/llm-protocol/provider", "crates/llm-protocol/openai", "crates/llm-protocol/anthropic",
]

[workspace.dependencies]
dioxus = { version = "0.7.9" }
sea-orm = { version = "1.1.20", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
] }

# workspace crates
keycompute-types = { path = "crates/keycompute-types" }
keycompute-db = { path = "crates/keycompute-db" }
keycompute-runtime = { path = "crates/keycompute-runtime" }
keycompute-auth = { path = "crates/keycompute-auth" }
keycompute-ratelimit = { path = "crates/keycompute-ratelimit" }
keycompute-pricing = { path = "crates/keycompute-pricing" }
keycompute-routing = { path = "crates/keycompute-routing" }
llm-protocol-provider = { path = "crates/llm-protocol/provider" }
llm-protocol-openai = { path = "crates/llm-protocol/openai" }
llm-protocol-anthropic = { path = "crates/llm-protocol/anthropic" }
llm-gateway = { path = "crates/llm-gateway" }
keycompute-billing = { path = "crates/keycompute-billing" }
keycompute-distribution = { path = "crates/keycompute-distribution" }
keycompute-observability = { path = "crates/keycompute-observability" }
keycompute-server = { path = "crates/keycompute-server" }
keycompute-config = { path = "crates/keycompute-config" }
keycompute-emailserver = { path = "crates/keycompute-emailserver" }
keycompute-alipay = { path = "crates/keycompute-payment/keycompute-alipay" }
keycompute-wechatpay = { path = "crates/keycompute-payment/keycompute-wechatpay" }
keycompute-cache = { path = "crates/keycompute-cache" }
node-gateway = { path = "crates/node-gateway" }
ui = { path = "packages/ui" }
client-api = { path = "packages/client-api" }

# ── WASM 体积优化 ──────────────────────────────────────
[profile.release]
opt-level = "z"       # 最小体积优化
lto = true             # 跨 crate 链接时优化，消除死代码
codegen-units = 1      # 最大优化机会（牺牲编译速度）
strip = true           # 移除调试符号
panic = "abort"        # 减少 panic 展开代码
